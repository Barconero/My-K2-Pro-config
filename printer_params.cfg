# F012
# Printer_size: 300x300x300
# Version: v1.0.0
# CreateDate: 2023/03/21
# Nozzle_mcu: chip: GD32F303CBT6
#             version: K1-NOZZLE-M_V12
# Leveling_mcu: chip: GD32E230F8P6
#             version: F008-L-V11
# mcu: chip: GD32F303RET6
#      version: CR4CU220812S12

[fan_feedback]
fan0_pin: PC6,PC2 # PTC (heater) Fan
fan1_pin: nozzle_mcu:PA12 # throat cooling fan
fan2_pin: nozzle_mcu:PC13 # Model cooling fan
print_delay_time: 5
current_delay_time: 2

[custom_macro]
default_bed_temp: 50 ##70 ## 50
default_extruder_temp: 225
g28_ext_temp: 140

# Product definition parameters
[gcode_macro product_param]
# Max size
variable_bed_size_x: 300
variable_bed_size_y: 300
variable_bed_size_z: 300
# Max temp
variable_nozzle_temp: 345 ## 300
variable_bed_temp: 120 ## 110
variable_chamber_temp: 60
gcode:
