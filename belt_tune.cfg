# ---------------------------------------------------------------------------
# [belt_tune] - stroboscopic belt tension tuning (EXPERIMENTAL)
#
# Copy belt_tune.py to ~/klipper/klippy/extras/
# then include this section in printer.cfg
#
# Every commented-out value below is the module default - uncomment only what
# you actually want to change.
# ---------------------------------------------------------------------------

[belt_tune]

# --- Strobe LED -------------------------------------------------------------

# Output pin driving the strobe LED. MUST be driven through a MOSFET / LED
# driver - do not connect a bright LED straight to the MCU pin.
# Any free digital output works. Prefix with ! if your driver is active-low.
#pin: LED_pin
#pin:multi_pin:LED_pin
pin: LED
#pin: PB0

# LED duty cycle, 0..1. Prusa uses 35/255 ~ 13.7%: short bright flashes on a
# mostly dark cycle make the frozen belt wave much easier to see.
# strobe_duty: 0.137

# The strobe runs at (excitation frequency + this offset), in Hz. A small
# offset makes the standing wave drift slowly instead of freezing dead still,
# which is easier for the eye to catch. Set 0.0 for a truly frozen image.
# strobe_offset_hz: 2.0

# --- Excitation -------------------------------------------------------------

# Default axis to shake: x / y / a / b
#   x, y  - work on any kinematics.
#   a, b  - CoreXY ONLY. each holds one CoreXY motor still, so a single
#           belt is excited at a time.
# On a Cartesian / bed-slinger machine use x or y.
# Can be overridden per run: BELT_TUNE_START AXIS=x
axis: y

# Excitation acceleration scales with frequency: accel = accel_per_hz * freq.
# NOTE: on start the module sets the printer accel limit to
#       accel_per_hz * freq_max  (with the values below: 75 * 140 = 10500).
# Lower accel_per_hz if that feels too aggressive for your machine.
# accel_per_hz: 75.0

# Frequency the wizard starts at. Begin well below the target and sweep up.
start_frequency: 60.0

# Hard limits for the tuning knob. Keep freq_max only as high as you need -
# it directly sets the accel limit above.
freq_min: 40.0
freq_max: 140.0

# Toolhead Z height while tuning.
# z_height: 30.0

# X,Y tuning position. Default is the centre of the bed.
# point: 150,150

# Move-queue feed tuning. Only touch these if you see stutter or
# "Timer too close" errors in klippy.log.
# lookahead_time: 0.5    ; seconds of motion kept queued (max 1.0)
# tick_time: 0.15

# Prompt button step sizes, in Hz.
# step_small: 0.5
# step_big: 2.0

# --- Target -----------------------------------------------------------------

# Resonant frequency you are tuning towards, in Hz.
# This value is belt-specific AND span-specific.
# if your free belt span is not the one this target was derived from,
# rescale it with  target_f = ref_f * ref_L / your_L
#target_frequency: 110.0
target_frequency: 92.0


# How close to target counts as "done", in Hz.
# tolerance_hz: 1.0

# --- Optional tension readout -----------------------------------------------

# If BOTH are set, the UI also shows tension in newtons via
# T = 4 * mass_per_metre * span^2 * freq^2 
# If either is 0 the readout is simply omitted - tuning works
# exactly the same either way.
#
# Values below are for Gates LL-2GT 6 mm belt on a 150 mm span
# (110 Hz ~ 9 N). MEASURE YOUR OWN SPAN and correct belt_length_m.
# belt_mass_kg_m: 0.0083
# belt_length_m: 0.150
belt_mass_kg_m: 0.0106
belt_length_m: 0.180
