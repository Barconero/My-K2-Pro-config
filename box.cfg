[gcode_macro BOX_INFO_REFRESH]
gcode:
  BOX_SET_PRE_LOADING ADDR={params.ADDR} NUM={params.NUM} ACTION=RUN
  M400
  BOX_GET_RFID ADDR={params.ADDR} NUM={params.NUM}
  M400
  BOX_GET_REMAIN_LEN ADDR={params.ADDR} NUM={params.NUM}
  M400

# CR_BOX_PRE_OPT
# CR_BOX_CUT
# CR_BOX_RETRUDE
# CR_BOX_EXTRUDE
# CR_BOX_WASTE
# CR_BOX_FLUSH
# CR_BOX_END_OPT
# CR_BOX_PRE_OPT_EXTRA
# CR_BOX_END_OPT_EXTRA
# 准备换耗材：M8200 P S[next]          CR_BOX_PRE_OPT
# 切刀动作 M8200 C S0                  CR_BOX_CUT
# 料盒退料动作：M8200 R I[pre] p0      CR_BOX_RETRUDE
# 料盒进料动作：M8200 L I[next] p1     CR_BOX_EXTRUDE
# 废料槽检测：M8200 W                  CR_BOX_WASTE
# 冲刷动作：M8200  F S[speed]L[length] CR_BOX_FLUSH
# 结束M8200 O S[next]                  CR_BOX_END_OPT

[gcode_macro M8200]
variable_tnn: None
gcode:
  {% if params.P is defined %}
    # 准备换耗材：M8200 P S[next]
    CR_BOX_PRE_OPT
  {% endif %}
  {% if params.C is defined %}
    # 切刀动作 M8200 C S0
    CR_BOX_CUT
  {% endif %}
  {% if params.R is defined %}
    # 料盒退料动作：M8200 R I[pre] p0
    {% if params.E is defined %}
      CR_BOX_RETRUDE LENGTH={params.E|float}
    {% else %}
      CR_BOX_RETRUDE
    {% endif %}
  {% endif %}
  {% if params.L is defined %}
    # 料盒进料动作：M8200 L I[next] p1
    {% set I_param = params.I|int %}
    {% set addr = (I_param / 4 + 1)|int|string %}
    {% set num_map = ['A', 'B', 'C', 'D'] %}
    {% set num = (I_param % 4)|int %}
    {% set tnn = 'T' + addr + num_map[num] %}
    {action_respond_info("tnn: %s" % tnn)}
    CR_BOX_EXTRUDE TNN={tnn}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='"{tnn}"'
    CR_BOX_WASTE
  {% endif %}
  {% if params.W is defined %}
    # 废料槽检测：M8200 W
    CR_BOX_WASTE
  {% endif %}
  {% if params.F is defined %}
    # 冲刷动作：M8200  F S[speed]L[length]
    {% set tnn = printer['gcode_macro M8200'].tnn %}
    {action_respond_info("tnn: %s" % tnn)}
    CR_BOX_FLUSH TNN={tnn}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='""'
  {% endif %}
  {% if params.O is defined %}
    # 结束M8200 O S[next]
    CR_BOX_END_OPT
  {% endif %}

##### Example T0 can be replaced by the following macro command #####
# # CR_BOX_PRE_OPT
# M8200 P
# # CR_BOX_CUT
# M8200 C
# # CR_BOX_RETRUDE
# M8200 R
# # CR_BOX_EXTRUDE
# M8200 L I0
# # CR_BOX_WASTE
# M8200 W
# # CR_BOX_FLUSH
# M8200 F
# # CR_BOX_END_OPT
# M8200 O


# # T command disassembles and replaces
# # Example T0 (assuming all materials are of the same type, current Z-coordinate 50, materials already inserted, current extrusion temperature 220, maximum extrusion temperature of T0 is 240)
# ## 1. Raise the Z-axis to prevent scratching the model
# G0 Z50.4 F600
# ## 2. Preprocessing
# M8200 P
# ## 3. Move to pre-cutting blade position
# G0 X10 Y200 F12000
# ## 4. Set the impactor speed, acceleration, and deceleration.
# SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=25000
# G0 F9000
# ## 5. Execute the cutting action
# M8200 C
# ## 6. Move to extrusion position
# ### First move the Y-axis
# G0 Y345 F12000
# ### 6.1. Move the X-axis, aligning with the waste chute; straight movement from this position carries no risk of collision.
# G0 X139
# ### 6.2. Move the Y-axis to enter the waste hopper
# G0 Y378
# ### 6.3. 移动X轴抬起挡板，易于接收废料，使其成型
# G0 X133
# ## 7. 耗材退到料盒
# M8200 R
# ## 8. 提前设置耗材挤出温度
# M104 S240
# ## 9. 料盒进料
# M8200 L I0
# ## 10. 冲刷（只展示一次）
# G91
# G0 E90 F600
# G90
# ### 10.1. 设置一下加速度与加减速，横擦一下，使用钢片割断耗材
# SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=5000
# G0 X160 F12000
# G0 X135
# ### 10.2 胶条上圆圈擦拭
# G0 X160 Y374 F12000
# G2 I4 J0 P1 F10000
# G0 X170 Y374 F12000
# G3 I-4 J0 P1 F10000
# ### 10.3 横擦抖动，并回到挤出位置
# G0 X160 Y378 F12000
# G0 X133 Y378 F12000
# G0 X160 Y378 F12000
# G0 X133 Y378 F12000
# G0 X160 Y378 F12000
# G0 X133 Y378 F12000
# ## 11. 移动出废料槽
# G0 X160
# G0 Y345 F12000
# ## 12. 结束处理
# M8200 O
# ## 13. 恢复Z轴（或者移动回模型后再恢复Z轴）
# G0 Z50 F600

