[serial_485 serial485]
serial: /dev/ttyS5
baud: 230400

[auto_addr]

[filament_rack]
not_pin: !PA5

[box]
bus:serial485
filament_sensor:filament_sensor
pre_cut_pos_x: 10           #The position of the pre-impact cutter should ensure a vertical impact.
pre_cut_pos_y: 280 ## 250 ближе к мусорнику
  
cut_pos_y: 280     ## 250 ближе к мусорнику
Tn_retrude: -20 ##-10 DXC2  #After cutting, the material is withdrawn from the extrusion gear by a specified length
Tn_retrude_velocity: 600    #Retract speed
Tn_extrude_temp: 220        #Extrusion temperature
Tn_extrude: 140             #preheat temperature
Tn_extrude_velocity: 360    #Extrusion speed
buffer_empty_len: 30        ## (DXC2 ???) #the buffer retraction allowance length needs to be extruded to the length allowed by the buffer (the length from the cutting blade inside the extruder to the extrusion gear).

##Left boundary of the wiper (???)
clean_left_pos_x: 138       #料槽吐完料摆动 左边界
clean_left_pos_y: 329

##Right boundary of the wiper (???)
clean_right_pos_x: 149      #料槽吐完料摆动 右边界
clean_right_pos_y: 329

clean_velocity: 12000
box_need_clean_length:60
cut_velocity: 30000

##Switch the material feeding position
extrude_pos_x: 124          #切换料吐料的位置
extrude_pos_y: 329

has_extrude_pos: 1          #有没有吐料需要  区分  K1_MAX 和  f008

safe_pos_y: 301
safe_pos_x: 205

clean_pos_left_x: 157       #Coordinates of the left boundary of the silicone nozzle
clean_pos_right_x:167       #Coordinates of the right boundary of the silicone nozzle
clean_pos_middle_y:327      #Y-axis midpoint coordinates of the silicone nozzle

pre_cut_cal_pos_x:-5        #Pre-cutting blade calibration position, reducing calibration time
check_cut_pos_x_max: -6.5   #maximum X of cutter calibration
check_cut_pos_x_min: -10    #Minimum X for cutter calibration
switch_pin:!nozzle_mcu:PB9
version: 1

;[box_pro]

[load_ai]

[gcode_macro BOX_LOAD_MATERIAL_HEATING]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  BOX_SET_TEMP

[gcode_macro BOX_LOAD_MATERIAL_CUT_MATERIAL]
gcode:
  BOX_CUT_MATERIAL
  BOX_SAVE_FAN

[gcode_macro BOX_LOAD_MATERIAL_RETRUDE_MATERIAL]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  BOX_SET_TEMP
  BOX_MODE_WAIT
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_LOAD_MATERIAL_EXTRUDE_MATERIAL]
gcode:
  {% set get_tnn = "" %}
  {% if 'TNN' in params|upper %}
    {% set get_tnn = ('TNN=' + params.TNN) %}
  {% endif %}
  BOX_MODE_WAIT
  BOX_EXTRUDE_MATERIAL {get_tnn}

[gcode_macro BOX_LOAD_MATERIAL_MATERIAL_FLUSH]
gcode:
  {% set get_tnn = "" %}
  {% if 'TNN' in params|upper %}
    {% set get_tnn = ('TNN=' + params.TNN) %}
  {% endif %}
  BOX_EXTRUDER_EXTRUDE {get_tnn}
  BOX_MATERIAL_CHANGE_FLUSH

[gcode_macro BOX_LOAD_MATERIAL_END]
gcode:
  BOX_RESTORE_FAN
  BOX_MOVE_TO_SAFE_POS

[gcode_macro BOX_LOAD_MATERIAL]
gcode:
  BOX_LOAD_MATERIAL_HEATING
  BOX_LOAD_MATERIAL_CUT_MATERIAL
  BOX_LOAD_MATERIAL_RETRUDE_MATERIAL
  BOX_LOAD_MATERIAL_EXTRUDE_MATERIAL
  BOX_LOAD_MATERIAL_MATERIAL_FLUSH
  BOX_LOAD_MATERIAL_END

[gcode_macro BOX_QUIT_MATERIAL_HEATING]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
    BOX_SET_TEMP
  {% endif %}

[gcode_macro BOX_QUIT_MATERIAL_CUT_MATERIAL]
gcode:
  BOX_CUT_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL_RETRUDE_MATERIAL]
gcode:
  BOX_GO_TO_EXTRUDE_POS
  {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
    BOX_SET_TEMP
  {% endif %}
  BOX_RETRUDE_MATERIAL

[gcode_macro BOX_QUIT_MATERIAL_END]
gcode:
  BOX_MOVE_TO_SAFE_POS

[gcode_macro BOX_QUIT_MATERIAL]
gcode:
  BOX_QUIT_MATERIAL_HEATING
  BOX_QUIT_MATERIAL_CUT_MATERIAL
  BOX_QUIT_MATERIAL_RETRUDE_MATERIAL
  BOX_QUIT_MATERIAL_END

