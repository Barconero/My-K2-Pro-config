# F012
# Printer_size: 300*300*300
# Version: v1.1.260206
# CreateDate: 2024/03/09
# Nozzle_mcu: chip: GD32F303CBT6
#             version: CR1FN200338C15
# mcu: chip: GD32F303RET6
#      version: CR4FN200338C15

[respond]

[include sensorless.cfg]
[include gcode_macro.cfg]
[include printer_params.cfg]
[include box.cfg]
[include motor_control.cfg]

## My
[include my_addons.cfg]
[include save-zoffset.cfg]
#[include belt_tune.cfg]

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[mcu rpi]
serial: /tmp/klipper_host_mcu

[bl24c16f]
i2c_mcu: rpi
i2c_bus: i2c.1
i2c_speed: 400000

[idle_timeout]
timeout: 99999999

[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[gcode_arcs]
resolution: 0.012

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -30
max_temp: 100


[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11

position_endstop: 302
position_min: -13
position_max: 302
homing_speed: 100
homing_retract_dist: 10

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
endstop_pin: PB12

position_endstop: -6.5
position_min: -6.5
position_max: 332
homing_speed: 100
homing_retract_dist: 10

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16
rotation_distance:8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 303
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
stealthchop_threshold: 0.2
sense_resistor: 0.100

[thermistor K2Plus_thermistor]
temperature1:25
resistance1:260000
temperature2:220
resistance2:738
temperature3:350
resistance3:98

[thermistor K2Pro_thermistor]
temperature1:25
resistance1:98633
temperature2:220
resistance2:377
temperature3:320
resistance3:73

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance:1000.0
step_pin:nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin:!nozzle_mcu:PB2
microsteps:16
rotation_distance:6.87  ##6.9
nozzle_diameter:0.400
filament_diameter:1.750
heater_pin:nozzle_mcu:PB8
sensor_type: PT1000
##sensor_type: K2Plus_thermistor
sensor_pin:nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
#control:pid
#pid_kp: 26.861
#pid_ki: 3.035
#pid_kd: 59.429
high_temp_value: 280
#pid_kp_high_temp: 28.227
#pid_ki_high_temp: 2.767
#pid_kd_high_temp: 71.978
min_temp:-30 # 0  20240326
max_temp:350 ##390
##max_power: 0.7 ## ограничение мощности на штатном БП

[thermistor custom_bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 35884.2
temperature3: 100
resistance3: 6610.1

[heater_bed]
heater_pin: PC8
sensor_type: custom_bed_thermistor
sensor_pin: PC4
#control: pid 
#pid_Kp: 37
#pid_Ki: 0.18
#pid_Kd: 280
min_temp: -30
max_temp: 140 ## 135  увеличиваем разрешенный предел

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}
  BOX_CHECK_MATERIAL_REFILL


[multi_pin heater_fans]
  pins:nozzle_mcu:PB7
 
[heater_fan hotend_fan]
pin:multi_pin:heater_fans
heater:extruder
heater_temp:50.0

[output_pin fan0_en]
pin: nozzle_mcu: PB6

[output_pin fan0]
pin: !nozzle_mcu: PB15
pwm: True
cycle_time: 0.01
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[multi_pin heater_fan2]
pins:PB4

[output_pin fan2]
pin: multi_pin:heater_fan2
pwm: True
##cycle_time: 0.0100
cycle_time: 0.0085
##cycle_time: 0.0050 ## ТЕСТ НА шум
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[multi_pin chassis_fan]
pins:PB1,PB3

[output_pin fan1]
pin: multi_pin:chassis_fan
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[heater_fan chamber_fan]
pin: !PB14   
enable_pin: PB2   
heater:chamber_heater
is_ptc_fan: 1
heater_temp: 100 # set an unattainable temperature, ensure that the fan does not work in lower temperature 
;fan_speed: 1.0 ## (!!!) from MasterLufier. потенциально увеличивает скорость вентилятора, нужно проверить.


[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[output_pin board_dissipation_fan]
pin: PA0

[duplicate_pin_override]
pins: PC5,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PB2,PB14,PB3,PB1

[heater_generic chamber_heater]
heater_pin:PC12  
max_power:1.0
sensor_type:NTC 100K MGB18-104F39050L32 
sensor_pin:PC5 
control: watermark
# control: pid
# pid_Kp: 37
# pid_Ki: 0.18
# pid_Kd: 280
min_temp:-30
max_temp:80

[verify_heater chamber_heater] 
check_gain_time:345600
heating_gain: 1
max_error: 120 ## 80  увеличиваем запас накопленных ошибок при печати
hysteresis: 20 ## 15  увеличиваем коридор "безопасного" падения температуры

[multi_pin filter_fan]
  pins:PB1,PB3

[temperature_fan chamber_fan]
pin:multi_pin: filter_fan
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 80
control: watermark
max_delta: 0.3
target_temp: 37.0
max_speed: 1.0
min_speed: 0.0

[multi_pin LED_pin]
pins:PB0,PA12

[output_pin LED]
pin:multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[output_pin extruder_fan]
pin: nozzle_mcu: PB1

[output_pin power]
pin: PC9

[output_pin ptc_power]
pin: PB2
value: 1

