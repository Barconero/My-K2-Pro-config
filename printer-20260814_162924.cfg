[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw
probe_points:
   150,150,150
min_freq: 20
max_freq: 120 
accel_per_hz: 100

[prtouch_v3]
z_offset: 0
speed: 5
samples: 1  ## 2 (!!!) - number of touches at one point
samples_result: average
samples_tolerance_retries: 5
samples_tolerance: 0.04 ## was 0.5

step_swap_pin: !PC7
pres_swap_pin: nozzle_mcu:PA15

prth_msg_show: False ## True  flood OFF
#prth_dbg_ippt: 172.21.20.205

temp_non_linaer_a = 0.00001750
temp_non_linaer_b = -0.00190000
temp_non_linaer_c = 0.0800000

pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
pres_tri_hold:4000, 10000, 500
# prth_tmp_comp: 26,300,0,0.135 #默认使用非线性温度补偿功能，26,300,0,0.11 使用2.5mm不削薄应变片+提高应变片激励电压方案 #26,300,0,0.135削薄应变片 
enable_not_linear_comp:True # Enable temperature nonlinearity compensation function， False - Disable (use linear compensation)
pres_cfg_regs:60 #60（1280/128）44（640/128）56（1280/64）
# prth_min_fans:0.8 # 0.1~ 1.0To ensure accuracy during leveling, the fan speed should be turned off or reduced.
# prth_gas_calr:0.001 # 高斯滤波标准差的开方，0.001 ~ 10，值越小，网床平滑滤波程序越弱,注释为关闭
prth_max_chps:8
prth_tri_zacc:1000
prth_min_fans:0.6

prth_clr_brush_pos = 160, 326.5 ## Middle of the wiping area on the silicone brush
prth_clr_probe_pos = 145, 306.5 ## Detection height near the wiping area on the heated bed
prth_clr_pose = 170, 306.5, 10  ## Location of the spray nozzle wiping area on the heated bed

elevated_chamber_temp: True # Pre-printing chamber temperature switch
# chamber_temp_comp_status: True # Cavity temperature dynamic compensation switch
# regional_prtouch_switch: False # The area leveling switch is enabled by default (True).
regional_prtouch_percentage:0.8
need_steady_regional:0.8 # Requires heated bed stabilization area
horizontal_move_z_quick: 1 # mm Lifting height during detection 

[bed_mesh]
speed: 450 ## чтоб не ждать долго
mesh_min: 5,5
mesh_max: 295,295
probe_count:9,9
mesh_pps: 2, 2
fade_start: 2.2 
fade_end: 12.2
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z:5
split_delta_z: 0.01
move_check_distance: 1

[display_status]

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
max_accel_to_decel: 20000
max_z_velocity: 10
square_corner_velocity: 10
max_z_accel: 300

[pause_resume]

[exclude_object]

[z_align]
distance_ratio: 0.85  # The ratio of the distance traveled upwards at high speed
quick_speed: 10 # mm/s  descent speed (скорость снижения)
slow_speed: 10 # mm/s  Detection speed
rising_dist: 10 # mm  The ascent distance after the first detection of photoelectric effect
safe_dist: 40 # mm  Safety value for heated bed tilt deviation: The allowable descent distance on the other side after photoelectric triggering on one side.
filter_cnt: 10 # 连续触发限位的次数，用作滤波
timeout: 80 # s 单次探测超时时间
retries: 5 # 重试次数
retry_tolerance: 10  # 两个光电的调整允许的最大偏差 10步 步距是0.0025mm
endstop_pin_z: PA15  # 光电触发,多个光电配置方式：endstop_pin_z: PA15, PA8... 最多支持4个
zd_up: 1  # 步进电机远离限位开关的电平
zes_untrig: 1  # 限位开关未触发时的电平
zmax_safe_pox_diff: 2 # zmax_safe_pox = stepper_z中的position_max-zmax_safe_pox_diff

[belt_mdl mdlx]
ch_max_dis: 5 # Maximum travel of module, mm
ch_best_n:  140 # Optimal belt tension, unit: N
ch_best_error: 0.15   # Belt inspection error value ±0.15

[belt_mdl mdly]
ch_max_dis: 5 # Maximum travel of module, mm
ch_best_n:  140 # Optimal belt tension, unit: N
ch_best_error: 0.15   # Belt inspection error value ±0.15


